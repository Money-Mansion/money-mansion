name: money_mansion
description: A starter Flutter project structure for Money Mansion.
version: 1.0.1+3
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  uuid: ^4.0.0
  sqflite: ^2.3.0
  sqflite_common_ffi: ^2.3.0
  sqlite3_flutter_libs: ^0.5.0
  path: ^1.8.3
  flutter_svg: ^2.0.0
  flame: ^1.10.0
  provider: ^6.0.0
  shared_preferences: ^2.2.2
  audioplayers: 6.0.0
  fl_chart: ^0.68.0
  http: ^1.2.1
  flutter_markdown: ^0.7.3+1
  url_launcher: ^6.3.0
  path_provider: ^2.1.2
  html: ^0.15.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"

flutter:
  uses-material-design: true
  
  # Vlastné ikony a obrázky
  assets:
    - assets/PRIVACY_POLICY.md
    - assets/icons/
    - assets/images/
    - assets/images/room/
    - assets/images/items/
    - assets/music/
    - assets/hitboxes/
    - assets/quizes/

  # Custom icon font
  fonts:
    - family: MyFlutterApp
      fonts:
        - asset: assets/fonts/MyFlutterApp.ttf
