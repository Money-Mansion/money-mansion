name: Auto Main Internal APK

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: auto-main-internal-apk
  cancel-in-progress: true

jobs:
  wait-for-main-to-settle:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for one hour without new main commits
        run: sleep 3600

  build-main-internal-apk:
    needs: wait-for-main-to-settle
    uses: Money-Mansion/money-mansion/.github/workflows/internal-overlay-apk.yml@feature/internal-github-apk-updater
    with:
      target_ref: ${{ github.sha }}
      updater_ref: feature/internal-github-apk-updater
      release_channel: main-auto
      changelog: "Automatic internal build from main"
      make_latest: true
      prerelease: false
    secrets:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
