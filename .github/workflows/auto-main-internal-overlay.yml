name: Manual Internal APK

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: manual-internal-apk
  cancel-in-progress: true

jobs:
  build-main-internal-apk:
    uses: Money-Mansion/money-mansion/.github/workflows/internal-overlay-apk.yml@feature/internal-github-apk-updater
    with:
      target_ref: ${{ github.sha }}
      updater_ref: feature/internal-github-apk-updater
      release_channel: main-auto
      changelog: "Manual internal build"
      make_latest: false
      prerelease: true
    secrets:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
