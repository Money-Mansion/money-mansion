# Money Mansion Backend Configuration
# This file can be extended for environment-specific settings

[DATABASE]
# Database name and location
db_name = money_mansion.db
db_path = ./database/

# Connection settings
timeout = 10
check_same_thread = false

[GAME]
# Default starting values
initial_coins = 111
initial_emeralds = 780
initial_date = 7.7
initial_level = 1

[CONSTRAINTS]
# Game constraints
max_inventory_items = 100
max_room_count = 10
max_task_count = 50

# Currency limits
max_coins = 999999
max_emeralds = 999999

# Item constraints
min_item_quantity = 1
max_item_quantity = 999

[LOGGING]
# Logging configuration
log_level = INFO
log_file = backend.log
log_format = %(asctime)s - %(name)s - %(levelname)s - %(message)s

[PERFORMANCE]
# Performance tuning
enable_query_caching = false
cache_duration_seconds = 300
enable_batch_operations = true

[SECURITY]
# Security settings
validate_input = true
sanitize_strings = true
enable_audit_logging = true
